name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.os }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            flatpak \
            flatpak-builder \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Generate third-party notices (Linux)
        if: runner.os == 'Linux'
        run: node scripts/notices.mjs --target x86_64-unknown-linux-gnu

      - name: Generate third-party notices (Windows)
        if: runner.os == 'Windows'
        run: node scripts/notices.mjs --target x86_64-pc-windows-msvc

      - name: Build bundles
        run: npm run tauri:build

      - name: Install Flatpak runtime
        if: runner.os == 'Linux'
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build Flatpak bundle
        if: runner.os == 'Linux'
        run: |
          appstreamcli validate --no-net flatpak/com.marksi.app.metainfo.xml
          npm run flatpak:stage
          flatpak-builder \
            --user \
            --force-clean \
            --repo=.tmp/flatpak-repo \
            --state-dir=.tmp/flatpak-state \
            .tmp/flatpak-build \
            flatpak/com.marksi.app.yml
          version="$(node -p "require('./package.json').version")"
          mkdir -p src-tauri/target/release/bundle/flatpak
          flatpak build-bundle \
            .tmp/flatpak-repo \
            "src-tauri/target/release/bundle/flatpak/MarkSI_${version}_x86_64.flatpak" \
            com.marksi.app \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Inspect Flatpak bundle
        if: runner.os == 'Linux'
        run: |
          bundle="$(find src-tauri/target/release/bundle/flatpak -name '*.flatpak' -print -quit)"
          flatpak install --user -y --noninteractive "$bundle"
          flatpak run --command=sh com.marksi.app -c \
            'test -x /app/bin/marksi && test -f /app/share/applications/com.marksi.app.desktop && test -f /app/share/metainfo/com.marksi.app.metainfo.xml'
          flatpak run --command=sh com.marksi.app -c \
            'if ldd /app/bin/marksi | grep "not found"; then echo "Unresolved shared libraries"; exit 1; fi'
          flatpak info com.marksi.app

      - name: Normalize artifact names
        run: npm run release:normalize

      - name: Write SHA256 checksums
        run: npm run release:checksums

      - name: Show checksums
        shell: bash
        run: cat src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Upload unsigned bundles and checksums
        uses: actions/upload-artifact@v4
        with:
          name: marksi-${{ matrix.os }}-unsigned
          path: |
            src-tauri/target/release/bundle/SHA256SUMS.txt
            THIRD_PARTY_NOTICES.md
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/flatpak/*.flatpak
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - meta
      - bundle
    if: needs.meta.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download unsigned bundles
        uses: actions/download-artifact@v4
        with:
          pattern: marksi-*-unsigned
          path: artifacts

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.flatpak' \) \
            -exec cp {} release-assets/ \;
          cp artifacts/marksi-windows-latest-unsigned/THIRD_PARTY_NOTICES.md \
            release-assets/THIRD_PARTY_NOTICES-windows.md
          cp artifacts/marksi-ubuntu-latest-unsigned/THIRD_PARTY_NOTICES.md \
            release-assets/THIRD_PARTY_NOTICES-linux.md
          cd release-assets
          for extension in msi exe deb rpm AppImage flatpak; do
            count="$(find . -maxdepth 1 -type f -name "*.${extension}" | wc -l)"
            if [[ "$count" -ne 1 ]]; then
              echo "Expected one .${extension} artifact, found ${count}"
              exit 1
            fi
          done
          sha256sum MarkSI* THIRD_PARTY_NOTICES-*.md > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release notes
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "docs/releases/${TAG}.md" ]]; then
            cp "docs/releases/${TAG}.md" release-notes.md
            exit 0
          fi
          version="${TAG#v}"
          version_code="$(node -p "require('./package.json').versionCode")"
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "# MarkSI ${version}"
            echo
            echo "MarkSI ${version}（versionCode \`${version_code}\`）。"
            echo
            echo "## 变更"
            echo
            if [[ -n "$previous" ]]; then
              range="${previous}..${TAG}"
            else
              range="${TAG}"
            fi
            changes="$(git log --no-merges --pretty=format:'%s' "$range" | grep -v '^Record ' || true)"
            if [[ -z "$changes" ]]; then
              changes="Release ${version}."
            fi
            echo "$changes" | sed 's/^/- /'
            echo
            echo
            echo "## 下载"
            echo
            echo "- **推荐**：\`MarkSI_${version}_x64-setup.exe\`，单个安装器内置英文、简体中文和繁体中文界面，并按系统语言选择。"
            echo "- **企业部署**：\`MarkSI_${version}_x64.msi\`，安装界面为 \`en-US\`，应用仍包含三种界面语言。"
            echo "- **Linux**：\`.deb\`、\`.rpm\`、\`.AppImage\` 和 \`.flatpak\`。"
            echo "- 所有安装包均未签名；Windows 可能显示 SmartScreen 提示。"
            echo
            echo "## 校验"
            echo
            echo "Release 附带合并的 \`SHA256SUMS.txt\` 和 Windows/Linux 两份第三方声明。请先校验下载文件的 SHA-256，再运行安装包。"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          title="MarkSI ${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" \
              --title "$title" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" release-assets/* \
              --title "$title" \
              --notes-file release-notes.md \
              --latest \
              --verify-tag
          fi
