[package]
name = "marksi"
version = "0.2.0"
description = "MarkSI - a focused Markdown studio for Windows and Linux"
authors = ["MarkSI contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.77.2"
repository = ""

[lib]
name = "marksi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8"
chardetng = "0.1"
tempfile = "3"
dunce = "1"
walkdir = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
